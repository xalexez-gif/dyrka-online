databases:
  - name: dyrka-db
    plan: free
    databaseName: dyrka
    user: dyrka

services:
  - type: web
    name: dyrka-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dyrka-db
          property: connectionString
      - key: SECRET
        generateValue: true
